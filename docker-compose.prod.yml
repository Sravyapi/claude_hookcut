services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hookcut
      POSTGRES_USER: hookcut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"

  backend:
    build: ./hookcut-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://hookcut:${POSTGRES_PASSWORD}@postgres:5432/hookcut
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FRONTEND_URL: http://localhost:3000
      FEATURE_V0_MODE: "false"
    depends_on:
      - postgres
      - redis
    volumes:
      - /tmp/hookcut:/tmp/hookcut
    env_file:
      - ./hookcut-backend/.env

  worker:
    build: ./hookcut-backend
    command: celery -A app.tasks.celery_app worker --beat --concurrency=2 -l info
    environment:
      DATABASE_URL: postgresql://hookcut:${POSTGRES_PASSWORD}@postgres:5432/hookcut
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - /tmp/hookcut:/tmp/hookcut
    env_file:
      - ./hookcut-backend/.env

  flower:
    build:
      context: ./hookcut-backend
    command: celery -A app.tasks.celery_app flower --port=5555 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  pgdata:
