[project]
name = "hookcut-backend"
version = "0.1.0"
description = "HookCut — Extract hook segments from YouTube videos and generate Shorts"
requires-python = ">=3.10"
dependencies = [
    # IMPORTANT: Run `pip-compile pyproject.toml -o requirements.lock.txt` to regenerate lockfile after changes
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic[email]>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "celery[redis]>=5.4,<6",
    "redis>=5.0,<6",
    "httpx>=0.27,<1",
    "openai>=1.50,<2",
    "anthropic>=0.39,<1",
    "youtube-transcript-api>=1.2,<2",
    "python-multipart>=0.0.9,<1",
    "python-dotenv>=1.0,<2",
    "psycopg2-binary>=2.9,<3",
    "PyJWT>=2.8,<3",
    "cryptography>=42.0,<44",
    "stripe>=10.0,<11",
    "razorpay>=1.4,<2",
    "sentry-sdk[fastapi,celery]>=2.0,<3",
    "posthog>=3.0,<4",
    "boto3>=1.35,<2",
    "passlib[bcrypt]>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "watchfiles>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
